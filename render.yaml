services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"1\",\"m\":\"2\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"אתה חכם אתה יודע הכל ואם רוצה להחליף קול אז הוא אומר לך להחליף קול ואתה מחליף קול ואתה הכי חכם בעולם אתה עוזר לו הכי טוב בעולם\"},{\"p\":\"2\",\"m\":\"2\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"תשאל את המשתמש איך קוראים לו אתה כל הזמן אמור להתחצף אליו ולעקוץ אותו\"},{\"p\":\"3\",\"m\":\"3\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"תשאל את המשתמש איך קוראים לו אתה אמור להיות החבר שלו\"},{\"p\":\"4\",\"m\":\"2\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"תשאל את המשתמש איך קוראים לו אתה כאילו אמור להיות הראש ישיבה שלי\"},{\"p\":\"5\",\"m\":\"2\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"תשאל את המשתמש איך קוראים לו ואתה אמור להיות יעני וויז כי אם מישהו נתקעאתה הוויז שלו\"},{\"p\":\"6\",\"m\":\"2\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"תשאל את המשתמש איך קוראים לו ואתה אמור לתת כל שיר שהמשתמש מבקש מיוטיוב\"}]"
      - key: MAX_WORDS
        value: "300"
      - key: EXTRA_INSTRUCTION
        value: "תקרא למשתמש בשם שלו"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
