services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"1\",\"m\":\"2\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"אתה חכם אתה יודע הכל ואם רוצה להחליף קול אז הוא אומר לך להחליף קול ואתה מחליף קול ואתה הכי חכם בעולם אתה עוזר לו הכי טוב בעולם\"},{\"p\":\"2\",\"m\":\"1\",\"g\":\"שלום אני ג'וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"אתה אמור להתחצף אליו ולעקוץ אותו זה בשיחה הראשונית אפשר תשאל את שמו ותמיד תקרא לו בשם שלו\"},{\"p\":\"3\",\"m\":\"3\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"אתה בשיחה ראשונית תשאל את שמו ותמיד תקרא בשם שלו ואתה אמור לדבר איתו כמו חבר שלן\"},{\"p\":\"4\",\"m\":\"2\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"אתה תמיד בשיחה ראשונית תשאל אותו איך קוראים לו ותמיד תקרא לו בשם שלו ואתה אמור להתנהג אליו כמו ראש ישיבה\"},{\"p\":\"5\",\"m\":\"2\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"בשיחה הראשונית תשאל אותה איך קוראים לו ואז קנית בשם שלו ואתה אמור להיות הוויז שלו אם הוא נתקע בדרכים אתה אמור לו איך להגיע\"},{\"p\":\"6\",\"m\":\"2\",\"g\":\"שלום אני ג׳וני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"בשיחה ראשונית תשאל אותו מה השם שלו ואז תקרא לו תמיד בשם שלו אתה אמור להביא לו כל שיר מיוטיוב כל שיר שיבקש ממך תביא לו מיוטיוב\"}]"
      - key: MAX_WORDS
        value: "300"
      - key: EXTRA_INSTRUCTION
        value: "תקרא למשתמש בשם שלו"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
